# ─────────────────────────────────────────────────────────────────────────────
# yt-clipper Clip Watcher — personal config
#   cp config.example.toml config.toml   (then edit)
# ─────────────────────────────────────────────────────────────────────────────

[twitch]
# The channel to watch — the name in twitch.tv/<name>, WITHOUT the leading '#'.
channel = "your_channel_here"
quality = "best"
retry_streams = 30          # seconds between "are they live yet?" checks

[paths]
work_dir      = "./work"    # raw stream.ts + chat.log per session land here
clips_dir     = "./clips"   # finished clips + manifest.jsonl
whisper_model = "./models/ggml-medium.en.bin"   # captions model (free download, see README)

[spike]
bucket_seconds     = 10     # messages per 10 seconds
window_seconds     = 300    # compare against the trailing 5 minutes
multiplier         = 3.0    # spike = 3x the trailing average
min_messages       = 6      # ignore near-silent baselines
merge_gap_seconds  = 30     # glue spiking buckets <=30s apart into one moment
pre_pad_seconds    = 8.0    # chat reacts AFTER the moment — start the cut early
post_pad_seconds   = 10.0   # let the reaction tail play out
max_clip_seconds   = 120.0  # hard cap per clip
min_clip_seconds   = 12.0

# ── pick ONE source ───────────────────────────────────────────────────────────
[source]
platform = "twitch"        # "twitch" or "youtube"

[youtube]
url  = ""                  # e.g. https://www.youtube.com/watch?v=VIDEO_ID  (live streams only)
name = "youtube_live"      # label for filenames/credits — use the streamer's handle

[virality]
enabled   = true           # score every clip 0-100, tag genres, write clips/ranked.json
max_clips = 0              # 0 = caption everything; N = caption only the N recommended clips

[shorts]
enabled = true             # also render *_shorts.mp4 (1080x1920) for every clip — ready for Shorts
mode    = "blur"           # "blur" = blurred 16:9 fill (keeps the whole HUD) | "crop" = full-bleed center crop

[captions]
enabled  = true             # whisper.cpp, runs locally, $0
burn_in  = true             # also render *.captioned.mp4 with subtitles baked in
language = "en"
